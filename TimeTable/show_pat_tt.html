<!DOCTYPE html>
<html>
<head>
  <title>Timetable Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    table {
      width: 80%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    th, td {
      border: 1px solid black;
      padding: 8px;
      text-align: center;
    }
    th {
      background: lightblue;
    }
    .batch-title {
      font-weight: bold;
      font-size: 20px;
      margin-top: 30px;
    }
    /* 🔴 Highlight style */
    .highlight {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h2>Upload CSV File</h2>
  <input type="file" id="csvFile" accept=".csv">

  <h3>Faculty-wise Timetable</h3>
  <select id="facultySelect">
    <option value="">-- Select Faculty --</option>
  </select>
  <button onclick="handleView()">View</button>

  <div id="tables"></div>

<script>
let originalData = [];

document.getElementById("csvFile").addEventListener("change", function () {
  Papa.parse(this.files[0], {
    header: true,
    skipEmptyLines: true,
    complete: function (result) {
      originalData = result.data;
      populateFacultyDropdown(result.data);
    }
  });
});

function populateFacultyDropdown(data) {
  const select = document.getElementById("facultySelect");
  const facultySet = new Set();

  select.innerHTML = `<option value="">-- Select Faculty --</option>`;

  data.forEach(row => {
    if (row.FACULTY) facultySet.add(row.FACULTY.trim());
  });

  facultySet.forEach(f => {
    const opt = document.createElement("option");
    opt.value = f;
    opt.textContent = f;
    select.appendChild(opt);
  });
}

function handleView() {
  const faculty = document.getElementById("facultySelect").value;
  if (!faculty) return alert("Please select a faculty");
  showFacultyTimetable(faculty);
}

/* ---------------- FACULTY-WISE VIEW ---------------- */

function showFacultyTimetable(faculty) {
  const days = ["MON", "TUE", "WED", "THU", "FRI", "SAT"];
  const timetable = {};
  days.forEach(d => timetable[d] = { FN: [], AN: [] });

  originalData.forEach(row => {
    if (row.FACULTY?.trim() === faculty) {
      let batch = row.BATCH?.trim();

      /* ✅ CORRECT MATCH */
      if (batch && batch.toUpperCase().includes("VI-SU-B2")) {
        batch = `<span class="highlight">${batch}</span>`;
      }

      timetable[row.DAY][row.SESSION].push(
        `${batch} (${row.COURSE})`
      );
    }
  });

  buildFacultyTable(faculty, timetable);
}

function buildFacultyTable(faculty, timetable) {
  const container = document.getElementById("tables");
  container.innerHTML = "";

  const title = document.createElement("h3");
  title.innerText = `Faculty Timetable: ${faculty}`;

  const table = document.createElement("table");

  let html = `
    <tr>
      <th>DAY</th>
      <th>FN</th>
      <th rowspan="7">L<br>U<br>N<br>C<br>H</th>
      <th>AN</th>
    </tr>
  `;

  for (const day in timetable) {
    html += `
      <tr>
        <td>${day}</td>
        <td>${timetable[day].FN.join("<br>")}</td>
        <td>${timetable[day].AN.join("<br>")}</td>
      </tr>
    `;
  }

  table.innerHTML = html;
  container.appendChild(title);
  container.appendChild(table);
}
</script>
</body>
</html>
